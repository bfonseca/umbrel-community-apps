services:
  # ── Nginx: serve o site estático ──────────────────────────
  ileve-web:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/ileve-ileve/site:/usr/share/nginx/html:ro
      - ${APP_DATA_DIR}/ileve-ileve/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - phpfpm
    networks:
      - default

  # ── PHP-FPM: endpoint de contacto ─────────────────────────
  phpfpm:
    image: php:8.2-fpm-alpine
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/ileve-ileve/site:/usr/share/nginx/html:ro
    working_dir: /usr/share/nginx/html
    networks:
      - default

  # ── app_proxy: roteamento e auth do Umbrel ────────────────
  app_proxy:
    environment:
      - APP_HOST=ileve-ileve_ileve-web_1
      - APP_PORT=80
      - PROXY_AUTH_ADD="false"
      - PROXY_AUTH_WHITELIST="/php/send-email.php"

networks:
  default:
    driver: bridge
